[project]
name = "llm-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Contributor 04" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "torch>=2.7.0",
    "transformers>=4.53.0",
    "uvicorn>=0.40.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
llama-cpp = ["llama-cpp-python>=0.3.0"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
